/* =============================================================================
   BROWSER TUNNEL — IDE CORE (part 1/3)
   Constants · resilient storage · icon runtime · design atoms · dashboard
   ============================================================================= */
const { useState, useEffect, useRef, useMemo, useCallback, useLayoutEffect } = React;

const APP_VERSION = '1.0.0';
const LS_PROJECTS = 'bt.projects.v1';
const LS_PREFS = 'bt.prefs.v1';
const LS_REVOKED = 'bt.revoked.v1';
const TUNNEL_TTL_MS = 15 * 60 * 1000;
const TUNNEL_WARN_CHARS = 7500;
const TUNNEL_HARD_CHARS = 60000;

/* -----------------------------------------------------------------------------
   Resilient storage — every read/write is guarded (private mode, quota, corruption)
   -------------------------------------------------------------------------- */
const Store = {
  lastError: null,
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    } catch (err) {
      this.lastError = err;
      return fallback;
    }
  },
  set(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      this.lastError = null;
      return { ok: true };
    } catch (err) {
      this.lastError = err;
      const name = (err && err.name) || '';
      const quota = name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' || err.code === 22 || err.code === 1014;
      return {
        ok: false,
        quota,
        message: quota
          ? 'Local storage quota exceeded — this project is too large to autosave. Export it to disk to keep your work.'
          : 'Local storage is unavailable (private browsing or blocked cookies) — changes will not survive a reload.'
      };
    }
  },
  remove(key) { try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ } },
  available() {
    try {
      const probe = '__bt_probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      return true;
    } catch (e) { return false; }
  }
};

/* -----------------------------------------------------------------------------
   Small utilities
   -------------------------------------------------------------------------- */
let __seq = 0;
function uid(prefix) {
  __seq += 1;
  const rnd = Math.random().toString(36).slice(2, 8);
  return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + __seq.toString(36) + rnd;
}
function bytes(n) {
  if (!n && n !== 0) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return '—'; }
}
function relTime(iso) {
  try {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    return fmtDate(iso).split(' · ')[0];
  } catch (e) { return '—'; }
}
function clock(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const m = String(Math.floor(total / 60)).padStart(2, '0');
  const s = String(total % 60).padStart(2, '0');
  return m + ':' + s;
}
function slug(name) {
  return String(name || 'project').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'project';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function newProject(name, type, imported) {
  const now = new Date().toISOString();
  const files = type === 'single'
    ? { html: imported && imported.html ? imported.html : TPL_SINGLE, css: '', js: '' }
    : {
        html: imported && imported.html ? imported.html : TPL_SPLIT_HTML,
        css: imported && imported.css ? imported.css : TPL_SPLIT_CSS,
        js: imported && imported.js ? imported.js : TPL_SPLIT_JS
      };
  return {
    id: uid('proj'),
    name: name && name.trim() ? name.trim() : 'Untitled Project',
    type,
    files,
    createdAt: now,
    updatedAt: now,
    lastTunnel: null
  };
}

/* -----------------------------------------------------------------------------
   Icon runtime — drives the Lucide UMD data set directly (no lucide-react needed)
   -------------------------------------------------------------------------- */
const LUCIDE = window.lucide || {};
function resolveIcon(name) {
  if (LUCIDE[name]) return LUCIDE[name];
  const kebab = String(name).replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
  if (LUCIDE[kebab]) return LUCIDE[kebab];
  const pascal = kebab.split('-').map((s) => s.charAt(0).toUpperCase() + s.slice(1)).join('');
  if (LUCIDE[pascal]) return LUCIDE[pascal];
  return LUCIDE.Circle || null;
}

const Icon = React.memo(function Icon({ name, size = 16, strokeWidth = 2, className = '' }) {
  const node = useMemo(() => {
    const data = resolveIcon(name);
    if (!data) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} className={className} />;
    }
    const attrs = data[1] || {};
    const children = data[2] || [];
    const props = { viewBox: attrs.viewBox || '0 0 24 24', fill: attrs.fill || 'none', stroke: attrs.stroke || 'currentColor', strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round', width: size, height: size, className };
    return (
      <svg {...props}>
        {children.map((child, i) => React.createElement(child[0], Object.assign({ key: i }, child[1])))}
      </svg>
    );
  }, [name, size, strokeWidth, className]);
  return node;
});

/* -----------------------------------------------------------------------------

function toast(message, kind = 'info', duration = 3600) {

  danger: 'bg-rose-500/90 text-white hover:bg-rose-500 active:bg-rose-400 border border-rose-400/40 shadow-lg shadow-rose-500/20',
  success: 'bg-emerald-500 text-slate-950 hover:bg-emerald-400 border border-emerald-400/40 shadow-lg shadow-emerald-500/20'
};
const BTN_SIZES = { xs: 'text-[11px] px-2 py-1 gap-1.5 rounded-md', sm: 'text-xs px-2.5 py-1.5 gap-1.5 rounded-lg', md: 'text-[13px] px-3.5 py-2 gap-2 rounded-lg', lg: 'text-sm px-5 py-2.5 gap-2 rounded-xl' };

function Btn({ children, icon, iconRight, variant = 'ghost', size = 'sm', className = '', disabled, title, ...rest }) {
  return (
    <button
      type="button"
      title={title}
      disabled={disabled}
      className={[
        'inline-flex items-center justify-center font-semibold tracking-tight transition-all duration-150 bt-focus select-none',
        'disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none',
        BTN_SIZES[size], BTN_VARIANTS[variant], className
      ].join(' ')}
      {...rest}
    >
      {icon ? <Icon name={icon} size={size === 'lg' ? 17 : size === 'md' ? 15 : 13} /> : null}
      {children ? <span className="truncate">{children}</span> : null}
      {iconRight ? <Icon name={iconRight} size={size === 'lg' ? 17 : size === 'md' ? 15 : 13} /> : null}
    </button>
  );
}

function Badge({ children, tone = 'slate', icon, className = '' }) {
  const tones = {
    slate: 'border-slate-700/70 bg-slate-800/60 text-slate-300',
    cyan: 'border-cyan-500/35 bg-cyan-500/10 text-cyan-300',
    violet: 'border-violet-500/35 bg-violet-500/10 text-violet-300',
    emerald: 'border-emerald-500/35 bg-emerald-500/10 text-emerald-300',
    amber: 'border-amber-500/35 bg-amber-500/10 text-amber-300',
    rose: 'border-rose-500/35 bg-rose-500/10 text-rose-300'
  };
  return (
    <span className={['inline-flex items-center gap-1.5 rounded-full border px-2 py-0.5 text-[10.5px] font-semibold uppercase tracking-[.12em]', tones[tone] || tones.slate, className].join(' ')}>
      {icon ? <Icon name={icon} size={11} /> : null}
      {children}
    </span>
  );
}

function Spinner({ size = 16, className = '' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" className={'animate-bt-spin ' + className}>
      <circle cx="12" cy="12" r="9" stroke="currentColor" strokeOpacity=".22" strokeWidth="2.5" />
      <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
    </svg>
  );
}

function Modal({ open, onClose, title, subtitle, icon, tone = 'cyan', children, footer, width = 'max-w-lg', dismissable = true }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => { if (e.key === 'Escape' && dismissable) onClose && onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.classList.add('bt-no-scroll');
    const t = setTimeout(() => { if (ref.current) ref.current.focus(); }, 30);
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.classList.remove('bt-no-scroll');
      clearTimeout(t);
    };
  }, [open, onClose, dismissable]);

  if (!open) return null;
  const toneRing = { cyan: 'border-cyan-500/30 bg-cyan-500/10 text-cyan-300', violet: 'border-violet-500/30 bg-violet-500/10 text-violet-300', rose: 'border-rose-500/30 bg-rose-500/10 text-rose-300', amber: 'border-amber-500/30 bg-amber-500/10 text-amber-300' }[tone];

  return (
    <div className="fixed inset-0 z-[70] flex items-start justify-center overflow-y-auto p-4 sm:items-center" role="dialog" aria-modal="true">
      <div className="fixed inset-0 bg-slate-950/80 bt-glass animate-bt-fade" onClick={() => dismissable && onClose && onClose()} />
      <div ref={ref} tabIndex={-1} className={['relative z-10 w-full outline-none animate-bt-pop', width].join(' ')}>
        <div className="overflow-hidden rounded-2xl border border-slate-800/70 bg-slate-900/90 bt-glass shadow-2xl shadow-black/70">
          {title ? (
            <div className="flex items-start gap-3 border-b border-slate-800/60 px-5 py-4">
              {icon ? <div className={['mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border', toneRing].join(' ')}><Icon name={icon} size={17} /></div> : null}
              <div className="min-w-0 flex-1">
                <h2 className="truncate text-sm font-semibold text-slate-100">{title}</h2>
                {subtitle ? <p className="mt-0.5 text-xs leading-relaxed text-slate-500">{subtitle}</p> : null}
              </div>
              {dismissable ? (
                <button type="button" onClick={onClose} className="rounded-lg p-1.5 text-slate-500 transition hover:bg-slate-800/70 hover:text-slate-200 bt-focus" aria-label="Close">
                  <Icon name="X" size={16} />
                </button>
              ) : null}
            </div>
          ) : null}
          <div className="px-5 py-5">{children}</div>
          {footer ? <div className="flex flex-wrap items-center justify-end gap-2 border-t border-slate-800/60 bg-slate-950/40 px-5 py-3.5">{footer}</div> : null}
        </div>
      </div>
    </div>
  );
}

function ConfirmDialog({ open, title, message, confirmLabel = 'Confirm', tone = 'danger', onCancel, onConfirm }) {
  return (
    <Modal
      open={open}
      onClose={onCancel}
      title={title}
      icon="AlertTriangle"
      tone={tone}
      width="max-w-md"
      footer={
        <>
          <Btn variant="outline" size="md" onClick={onCancel}>Cancel</Btn>
          <Btn variant={tone === 'danger' ? 'danger' : 'primary'} size="md" onClick={onConfirm} icon="Check">{confirmLabel}</Btn>
        </>
      }
    >
      <p className="text-sm leading-relaxed text-slate-400">{message}</p>
    </Modal>
  );
}

function Toasts({ items }) {
  const tones = {
    info: 'border-slate-700/70 bg-slate-900/92 text-slate-200',

function Field({ label, hint, children, required }) {

    <label className="block">
      <span className="mb-1.5 flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-[.14em] text-slate-400">
        {label}{required ? <span className="text-cyan-400">*</span> : null}

const inputCls = 'w-full rounded-lg border border-slate-800/80 bg-slate-950/70 px-3 py-2 text-[13px] text-slate-100 placeholder-slate-600 outline-none transition focus:border-cyan-500/60 focus:ring-2 focus:ring-cyan-500/20 bt-focus';

/* -----------------------------------------------------------------------------
   Dashboard
   -------------------------------------------------------------------------- */

  const [confirming, setConfirming] = useState(false);
  const size = Object.keys(project.files).reduce((acc, k) => acc + ((project.files[k] || '').length), 0);
  const tunnel = project.lastTunnel;

  return (
    <>
      <article className="group relative flex flex-col overflow-hidden rounded-2xl border border-slate-800/60 bg-slate-900/80 bt-glass p-4 bt-card-hover animate-bt-rise">
        <div className="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full opacity-0 blur-3xl transition-opacity duration-300 group-hover:opacity-100"
             style={{ background: project.type === 'single' ? 'rgba(34,211,238,.18)' : 'rgba(167,139,250,.18)' }} />
        <div className="relative flex items-start justify-between gap-3">
          <div className="min-w-0 flex-1">

            </button>
            <p className="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] text-slate-500">

        </div>

        <div className="relative mt-4 grid grid-cols-3 gap-2 text-center">

            <div key={k} className="rounded-lg border border-slate-800/60 bg-slate-950/50 px-2 py-1.5">

        <div className="relative mt-4 flex flex-wrap items-center gap-1.5 border-t border-slate-800/60 pt-3">
          <Btn variant="primary" size="sm" icon="SquarePen" onClick={onOpen}>Open</Btn>
          <Btn variant="outline" size="sm" icon="PencilLine" onClick={onRename} title="Rename project">Rename</Btn>

        </div>

      <ConfirmDialog
        open={confirming}
        title="Delete this project?"
        message={'“' + project.name + '” and all of its files will be permanently removed from this browser. This cannot be undone.'}
        confirmLabel="Delete project"
        onCancel={() => setConfirming(false)}
        onConfirm={() => { setConfirming(false); onDelete(); }}
      />

  );
}

function Dashboard({ projects, onNew, onOpen, onRename, onDownload, onDelete, storageOk }) {
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('recent');

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase();
    let list = projects.filter((p) => !q || p.name.toLowerCase().includes(q) || p.type.includes(q));
    list = list.slice().sort((a, b) => {
      if (sort === 'name') return a.name.localeCompare(b.name);
      if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
      if (sort === 'size') {
        const sz = (p) => Object.keys(p.files).reduce((acc, k) => acc + (p.files[k] || '').length, 0);
        return sz(b) - sz(a);
      }
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    });
    return list;
  }, [projects, query, sort]);

  const single = projects.filter((p) => p.type === 'single').length;

  return (
    <div className="relative mx-auto w-full max-w-[1400px] px-4 pb-24 pt-8 sm:px-6 lg:px-8">
      <header className="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
        <div className="animate-bt-rise">
          <div className="flex items-center gap-2.5">
            <div className="relative flex h-11 w-11 items-center justify-center rounded-xl border border-cyan-500/30 bg-gradient-to-br from-cyan-500/20 to-violet-500/10 text-cyan-300">
              <Icon name="Rocket" size={21} />
              <span className="bt-caret-ring rounded-xl" />
            </div>
            <div>
              <h1 className="text-xl font-semibold tracking-tight text-slate-50 sm:text-2xl">Browser Tunnel</h1>
              <p className="text-[12px] text-slate-500">Backendless web IDE · iframe-free deployment tunnels</p>
            </div>
          </div>
          <div className="mt-4 flex flex-wrap items-center gap-2">
            <Badge tone="cyan" icon="FolderKanban">{projects.length} project{projects.length === 1 ? '' : 's'}</Badge>
            <Badge tone="violet" icon="FileCode2">{single} single-file</Badge>
            <Badge tone="slate" icon="Layers">{projects.length - single} multi-file</Badge>
            <Badge tone={storageOk ? 'emerald' : 'rose'} icon={storageOk ? 'Database' : 'DatabaseZap'}>
              {storageOk ? 'LocalStorage online' : 'Storage blocked'}
            </Badge>
          </div>
        </div>

        <div className="flex flex-col gap-2 sm:items-end animate-bt-rise">
          <Btn variant="primary" size="lg" icon="Plus" onClick={onNew} className="w-full sm:w-auto">
            New Project
          </Btn>
          <p className="text-[11px] text-slate-500">Everything persists in this browser — no backend, no account.</p>
        </div>
      </header>

      {projects.length > 0 ? (
        <div className="mt-7 flex flex-col gap-3 sm:flex-row sm:items-center">
          <div className="relative flex-1">
            <Icon name="Search" size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
            <input
              type="search"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search projects by name or structure…"
              className={inputCls + ' pl-9'}
            />
          </div>
          <div className="flex items-center gap-2">
            <Icon name="ArrowUpDown" size={14} className="text-slate-500" />
            <select value={sort} onChange={(e) => setSort(e.target.value)} className={inputCls + ' w-auto cursor-pointer pr-8'}>
              <option value="recent">Recently edited</option>
              <option value="oldest">Oldest first</option>
              <option value="name">Name (A–Z)</option>
              <option value="size">Largest first</option>
            </select>
          </div>
        </div>
      ) : null}

      <section className="mt-6">
        {projects.length === 0 ? (
          <EmptyState
            icon="FolderPlus"
            title="No projects yet"
            message="Spin up your first workspace. Choose a single unified HTML file or a split HTML / CSS / JS component view — then push it live through a tunnel URL."
            action={<Btn variant="primary" size="lg" icon="Plus" onClick={onNew}>Create your first project</Btn>}
          />
        ) : visible.length === 0 ? (
          <EmptyState icon="SearchX" title="No matches" message={'Nothing matched “' + query + '”. Try a different search term or clear the filter.'} action={<Btn variant="outline" size="md" icon="X" onClick={() => setQuery('')}>Clear search</Btn>} />
        ) : (
          <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
            {visible.map((p) => (
              <ProjectCard
                key={p.id}
                project={p}
                onOpen={() => onOpen(p.id)}
                onRename={() => onRename(p)}
                onDownload={() => onDownload(p)}
                onDelete={() => onDelete(p)}
              />
            ))}
          </div>
        )}
      </section>

      <footer className="mt-14 flex flex-col items-center gap-2 border-t border-slate-800/50 pt-6 text-center">
        <p className="text-[11px] leading-relaxed text-slate-600">
          Browser Tunnel v{APP_VERSION} · React 18 · Tailwind 3.4 · Lucide · lz-string · JSZip — all via pinned CDNs.
          Tunnels are encoded in the URL itself and self-destruct after 15 minutes.
        </p>
      </footer>
    </div>
  );
}

/* -----------------------------------------------------------------------------
   New-project wizard (two sequential steps)
   -------------------------------------------------------------------------- */
function NewProjectModal({ open, onClose, onCreate }) {
  const [step, setStep] = useState(1);
  const [type, setType] = useState(null);
  const [name, setName] = useState('');
  const [imported, setImported] = useState(null);
  const [importName, setImportName] = useState('');
  const [error, setError] = useState('');
  const fileRef = useRef(null);

  useEffect(() => {
    if (open) { setStep(1); setType(null); setName(''); setImported(null); setImportName(''); setError(''); }
  }, [open]);

  const pickStructure = (t) => { setType(t); setError(''); setStep(2); };

  const handleFile = (file) => {
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { setError('That file is larger than 2 MB — import a smaller source file.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || '');
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const slot = ext === 'css' ? 'css' : (ext === 'js' || ext === 'mjs' ? 'js' : 'html');
      setImported((prev) => Object.assign({}, prev, { [slot]: text }));
      setImportName(file.name);
      setError('');
      if (!name.trim()) setName(file.name.replace(/\.[^.]+$/, ''));
      toast('Imported ' + file.name + ' → ' + slot.toUpperCase() + ' pane', 'success');
    };
    reader.onerror = () => setError('That file could not be read. Try another file.');
    reader.readAsText(file);
  };

  const submit = () => {
    if (!name.trim()) { setError('Give your project a name to continue.'); return; }
    onCreate(name, type, imported);
  };

  const structures = [
    {
      key: 'single', icon: 'FileCode2', tone: 'cyan',
      title: 'Single Unified HTML File',
      desc: 'One document holds markup, styles and script. Fastest path to a tunnel — ideal for demos, prototypes and shareable single-page builds.',
      points: ['1 editable pane', 'Instant tunnel encoding', 'Downloads as a clean .html']
    },
    {
      key: 'split', icon: 'Layers', tone: 'violet',
      title: 'Split Component View',
      desc: 'Author HTML, CSS and JavaScript in separate panes. Fused into one document at preview and tunnel time, exported as a .zip structure.',
      points: ['3 isolated panes', 'Live fused preview', 'Downloads as a .zip']
    }
  ];

  return (
    <Modal
      open={open}
      onClose={onClose}
      title={step === 1 ? 'Choose a project structure' : 'Project metadata'}
      subtitle={step === 1 ? 'Step 1 of 2 — how should your workspace be laid out?' : 'Step 2 of 2 — name it, optionally seed it from a local file.'}
      icon={step === 1 ? 'LayoutTemplate' : 'PencilRuler'}
      tone={step === 1 ? 'cyan' : 'violet'}
      width="max-w-2xl"
      footer={
        <>
          {step === 2 ? <Btn variant="outline" size="md" icon="ArrowLeft" onClick={() => setStep(1)}>Back</Btn> : null}
          <Btn variant="ghost" size="md" onClick={onClose}>Cancel</Btn>
          {step === 2 ? <Btn variant="primary" size="md" icon="Sparkles" onClick={submit}>Create project</Btn> : null}
        </>
      }
    >
      <div className="mb-5 flex items-center gap-2">
        {[1, 2].map((n) => (
          <div key={n} className="flex flex-1 items-center gap-2">
            <div className={['flex h-6 w-6 shrink-0 items-center justify-center rounded-full border text-[11px] font-bold transition',
              step >= n ? 'border-cyan-400/60 bg-cyan-500/20 text-cyan-200' : 'border-slate-700 bg-slate-950/60 text-slate-500'].join(' ')}>
              {step > n ? <Icon name="Check" size={12} /> : n}
            </div>
            <div className={['h-px flex-1 transition', step > n ? 'bg-cyan-500/50' : 'bg-slate-800'].join(' ')} />
          </div>
        ))}
      </div>

      {step === 1 ? (
        <div className="grid gap-3 sm:grid-cols-2">
          {structures.map((s) => (
            <button
              key={s.key}
              type="button"
              onClick={() => pickStructure(s.key)}
              className={['group relative overflow-hidden rounded-xl border p-4 text-left transition-all duration-200 bt-focus',
                'border-slate-800/70 bg-slate-950/60 hover:border-cyan-500/50 hover:bg-slate-900/80 hover:-translate-y-0.5'].join(' ')}
            >
              <div className={['mb-3 flex h-10 w-10 items-center justify-center rounded-lg border',
                s.tone === 'cyan' ? 'border-cyan-500/30 bg-cyan-500/10 text-cyan-300' : 'border-violet-500/30 bg-violet-500/10 text-violet-300'].join(' ')}>
                <Icon name={s.icon} size={19} />
              </div>
              <h3 className="text-[13.5px] font-semibold tracking-tight text-slate-100">{s.title}</h3>
              <p className="mt-1.5 text-[12px] leading-relaxed text-slate-500">{s.desc}</p>
              <ul className="mt-3 space-y-1">
                {s.points.map((p) => (
                  <li key={p} className="flex items-center gap-1.5 text-[11px] text-slate-400">
                    <Icon name="Dot" size={14} className={s.tone === 'cyan' ? 'text-cyan-400' : 'text-violet-400'} />{p}
                  </li>
                ))}
              </ul>
              <span className="mt-3 inline-flex items-center gap-1 text-[11px] font-semibold text-slate-400 transition group-hover:text-cyan-300">
                Select <Icon name="ArrowRight" size={12} />
              </span>
            </button>
          ))}
        </div>
      ) : (
        <div className="space-y-4">
          <div className="flex items-center gap-2 rounded-lg border border-slate-800/70 bg-slate-950/50 px-3 py-2.5">

/* -----------------------------------------------------------------------------
   Lightweight tokenizers — escape first, wrap second, so markup can never break
   -------------------------------------------------------------------------- */
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, (c) => ESC_MAP[c]); }

function hlAttrs(src) {
  let out = '', last = 0, m;
  const re = /([A-Za-z_:][\w:.-]*)(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+)?/g;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    out += '<span class="tk-attr">' + esc(m[1]) + '</span>';
    if (m[2]) out += esc(m[2]);
    if (m[3]) out += '<span class="tk-str">' + esc(m[3]) + '</span>';
    last = re.lastIndex;
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  return out + esc(src.slice(last));
}

function hlHTML(code) {
  let out = '', last = 0, m;
  const re = /(<!--[\s\S]*?-->)|(<!DOCTYPE[^>]*>)|(<\/?)([A-Za-z][\w:-]*)((?:[^>"']|"[^"]*"|'[^']*')*?)(\/?>)/g;
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-doc">' + esc(m[2]) + '</span>';
    else {
      out += '<span class="tk-punc">' + esc(m[3]) + '</span><span class="tk-tag">' + esc(m[4]) + '</span>';
      out += hlAttrs(m[5] || '');
      out += '<span class="tk-punc">' + esc(m[6]) + '</span>';
    }
    last = re.lastIndex;
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  return out + esc(code.slice(last));
}

function hlCSS(code) {
  let out = '', last = 0, m;
  const re = /(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(@[\w-]+)|([{}();:,])|([A-Za-z-]+)(\s*:)|(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr|ch|pt)?\b)|(!important)/g;
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-sel">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-brace">' + esc(m[4]) + '</span>';
    else if (m[5]) out += '<span class="tk-prop">' + esc(m[5]) + '</span>' + esc(m[6]);
    else if (m[7]) out += '<span class="tk-num">' + esc(m[7]) + '</span>';
    else if (m[8]) out += '<span class="tk-kw">' + esc(m[8]) + '</span>';
    last = re.lastIndex;
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  return out + esc(code.slice(last));
}

const JS_KEYWORDS = 'const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|default|new|class|extends|super|this|import|export|from|as|await|async|try|catch|finally|throw|typeof|instanceof|in|of|delete|void|yield|static|get|set|null|undefined|true|false|NaN';

function hlJS(code) {
  let out = '', last = 0, m;
  const re = new RegExp(
    '(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\'|`(?:[^`\\\\]|\\\\.)*`)|(\\b(?:' + JS_KEYWORDS + ')\\b)|(\\b[A-Za-z_$][\\w$]*)(?=\\s*\\()|(\\b\\d+(?:\\.\\d+)?\\b)|([{}()\\[\\];,.])', 'g');
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-kw">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-fn">' + esc(m[4]) + '</span>';
    else if (m[5]) out += '<span class="tk-num">' + esc(m[5]) + '</span>';
    else if (m[6]) out += '<span class="tk-brace">' + esc(m[6]) + '</span>';
    last = re.lastIndex;
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  return out + esc(code.slice(last));
}

function highlight(code, lang) {
  try {
    if (lang === 'html') return hlHTML(code);
    if (lang === 'css') return hlCSS(code);
    return hlJS(code);
  } catch (e) {
    return esc(code);
  }
}

/* -----------------------------------------------------------------------------
   Code editor — transparent textarea layered over a highlighted <pre>, with a
   synchronised gutter. Tab inserts two spaces; Enter keeps the indentation.
   -------------------------------------------------------------------------- */
function CodePane({ lang, label, value, onChange, accent, badge }) {
  const taRef = useRef(null);
  const hlRef = useRef(null);
  const gutterRef = useRef(null);

  const syncScroll = useCallback(() => {
    const ta = taRef.current;
    if (!ta) return;
    if (hlRef.current) { hlRef.current.scrollTop = ta.scrollTop; hlRef.current.scrollLeft = ta.scrollLeft; }
    if (gutterRef.current) gutterRef.current.scrollTop = ta.scrollTop;
  }, []);

  useEffect(() => { syncScroll(); }, [value, syncScroll]);

  const lines = useMemo(() => value.split('\n').length, [value]);
  const html = useMemo(() => highlight(value, lang) + '\n', [value, lang]);

  const onKeyDown = (e) => {
    const ta = e.target;
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      const next = value.slice(0, s) + '  ' + value.slice(en);
      onChange(next);
      requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = s + 2; });
      return;
    }
    if (e.key === 'Enter') {
      const s = ta.selectionStart;
      const lineStart = value.lastIndexOf('\n', s - 1) + 1;
      const indentMatch = /^[ \t]*/.exec(value.slice(lineStart, s));
      const indent = indentMatch ? indentMatch[0] : '';
      if (indent) {
        e.preventDefault();
        const insert = '\n' + indent;
        const next = value.slice(0, s) + insert + value.slice(ta.selectionEnd);
        onChange(next);
        requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = s + insert.length; });
      }
    }
  };

  const accents = {
    cyan: 'text-cyan-300',
    violet: 'text-violet-300',
    amber: 'text-amber-300'
  };

  return (
    <div className="flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-800/60 bg-slate-950/70">
      <div className="flex items-center gap-2 border-b border-slate-800/60 bg-slate-900/60 px-3 py-2 bt-glass">
        <Icon name={lang === 'html' ? 'FileCode2' : lang === 'css' ? 'Paintbrush' : 'Braces'} size={14} className={accents[accent] || 'text-slate-400'} />
        <span className="text-[11px] font-semibold uppercase tracking-[.14em] text-slate-300">{label}</span>
        {badge ? <span className="text-[10px] text-slate-500">{badge}</span> : null}
        <span className="ml-auto flex items-center gap-3 font-mono text-[10.5px] text-slate-500">
          <span>{lines} ln</span>
          <span>{value.length} ch</span>
        </span>
      </div>
      <div className="flex min-h-0 flex-1">
        <div ref={gutterRef} className="bt-gutter bt-code hidden shrink-0 sm:block" style={{ width: 56 }}>
          {Array.from({ length: lines }, (_, i) => <span key={i}>{i + 1}</span>)}
        </div>
        <div className="bt-editor-wrap min-h-0 flex-1">
          <pre ref={hlRef} aria-hidden="true" className="bt-hl bt-code bt-scroll" dangerouslySetInnerHTML={{ __html: html }} />
          <textarea
            ref={taRef}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            onScroll={syncScroll}
            onKeyDown={onKeyDown}
            spellCheck={false}
            wrap="off"
            autoCapitalize="off"
            autoCorrect="off"
            autoComplete="off"
            aria-label={label + ' editor'}
            className="bt-ta bt-code bt-scroll"
          />
        </div>
      </div>
    </div>
  );
}

   Workspace · document composition · tunnel engine · root app · boot sequence

/* -----------------------------------------------------------------------------
   Document composition — fuse split files into one standalone document
   -------------------------------------------------------------------------- */
function composeDocument(project) {
  if (!project) return '';
  const files = project.files || {};
  if (project.type === 'single') return files.html || '';

  let html = files.html || '';
  const css = (files.css || '').trim();
  const js = (files.js || '').trim();

  const styleTag = css ? '<style>\n' + css + '\n</style>' : '';
  const scriptTag = js ? '<script>\n' + js + '\n<\/script>' : '';

  if (styleTag) {
    if (/<\/head>/i.test(html)) html = html.replace(/<\/head>/i, styleTag + '\n</head>');
    else html = styleTag + '\n' + html;
  }
  if (scriptTag) {
    if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, scriptTag + '\n</body>');
    else html = html + '\n' + scriptTag;
  }
  return html;
}

function baseUrl() {
  return window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
}

/* -----------------------------------------------------------------------------
   Downloads
   -------------------------------------------------------------------------- */
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadProject(project) {
  try {
    const doc = composeDocument(project);
    if (project.type === 'single') {
      triggerDownload(new Blob([doc], { type: 'text/html;charset=utf-8' }), slug(project.name) + '.html');
      toast('Downloaded ' + slug(project.name) + '.html', 'success');
      return;
    }
    if (typeof JSZip === 'undefined') {
      triggerDownload(new Blob([doc], { type: 'text/html;charset=utf-8' }), slug(project.name) + '.html');
      toast('JSZip unavailable — exported the fused document instead', 'warn');
      return;
    }
    const zip = new JSZip();
    const root = zip.folder(slug(project.name));
    root.file('index.html', doc);
    root.file('style.css', project.files.css || '');
    root.file('app.js', project.files.js || '');
    root.file('source/index.html', project.files.html || '');
    root.file('README.md',
      '# ' + project.name + '\n\n' +
      'Exported from Browser Tunnel on ' + new Date().toISOString() + '.\n\n' +
      '## Contents\n' +
      '- `index.html` — the fused, standalone document (markup + styles + script)\n' +
      '- `style.css`, `app.js` — the individual source files\n' +
      '- `source/index.html` — the original HTML shell\n\n' +
      'Open `index.html` directly in a browser; it needs no build step and no server.\n');
    zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } }).then((blob) => {
      triggerDownload(blob, slug(project.name) + '.zip');
      toast('Downloaded ' + slug(project.name) + '.zip (4 files)', 'success');
    }).catch((err) => {
      toast('Zip packaging failed: ' + (err && err.message ? err.message : 'unknown error'), 'error');
    });
  } catch (err) {
    toast('Download failed: ' + (err && err.message ? err.message : 'unknown error'), 'error');
  }
}

/* -----------------------------------------------------------------------------
   Workspace
   -------------------------------------------------------------------------- */
function Workspace({ project, onUpdate, onBack, onDelete }) {
  const isSplit = project.type === 'split';
  const [pane, setPane] = useState(isSplit ? 'html' : 'html');
  const [mode, setMode] = useState(isSplit ? 'columns' : 'split');
  const [renaming, setRenaming] = useState(false);
  const [nameDraft, setNameDraft] = useState(project.name);
  const [previewKey, setPreviewKey] = useState(0);
  const [copied, setCopied] = useState(false);
  const [confirm, setConfirm] = useState(null);
  const [tunnel, setTunnel] = useState(null);
  const [showTunnel, setShowTunnel] = useState(false);
  const [swState, setSwState] = useState('checking');

  const files = project.files;
  const doc = useMemo(() => composeDocument(project), [project]);
  const payload = useMemo(() => {
    try { return typeof LZString !== 'undefined' ? LZString.compressToEncodedURIComponent(doc) : ''; }
    catch (e) { return ''; }
  }, [doc]);

  /* ---- service worker lifecycle ---- */
  useEffect(() => {
    let alive = true;
    if (!('serviceWorker' in navigator)) { setSwState('unsupported'); return undefined; }
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then((reg) => {
        if (!alive) return;
        setSwState(reg.active ? 'active' : 'installing');
        if (!reg.active && reg.installing) {
          reg.installing.addEventListener('statechange', (e) => {
            if (alive && e.target.state === 'activated') setSwState('active');
          });
        }
      })
      .catch(() => { if (alive) setSwState('failed'); });
    return () => { alive = false; };
  }, []);

  /* ---- keep the pane valid when the structure changes ---- */
  useEffect(() => { if (!isSplit && pane !== 'html') setPane('html'); }, [isSplit, pane]);

  /* ---- tunnel expiry watchdog ---- */
  useEffect(() => {
    if (!tunnel) return undefined;
    const t = setInterval(() => {
      if (Date.now() > tunnel.exp) {
        setTunnel((cur) => cur);
        clearInterval(t);
      }
    }, 1000);
    return () => clearInterval(t);
  }, [tunnel]);

  const setFile = useCallback((key, value) => {
    onUpdate({ files: Object.assign({}, files, { [key]: value }) });
  }, [files, onUpdate]);

  const renameCommit = () => {
    const next = nameDraft.trim();
    if (!next) { toast('A project name cannot be empty', 'warn'); setNameDraft(project.name); setRenaming(false); return; }
    onUpdate({ name: next });
    setRenaming(false);
    toast('Renamed to “' + next + '”', 'success');
  };

  const clearPane = () => {
    const keys = isSplit ? [pane] : ['html'];
    const next = Object.assign({}, files);
    keys.forEach((k) => { next[k] = ''; });
    onUpdate({ files: next });
    toast('Cleared the ' + keys[0].toUpperCase() + ' pane', 'info');
  };

  const wipeTemplate = () => {
    const next = isSplit
      ? { html: TPL_SPLIT_HTML.replace(/<link rel="stylesheet" href="style\.css">\n?/, '').replace(/<script src="app\.js"><\/script>\n?/, ''), css: '', js: '' }
      : { html: BLANK_SINGLE, css: '', js: '' };
    onUpdate({ files: next });
    setConfirm(null);
    setPreviewKey((k) => k + 1);
    toast('Template removed — blank canvas ready', 'success');
  };

  const spinUpTunnel = () => {
    if (typeof LZString === 'undefined') {
      toast('lz-string failed to load — the tunnel encoder is unavailable', 'error');
      return;
    }
    const exp = Date.now() + TUNNEL_TTL_MS;
    const id = uid('tun');
    const url = baseUrl() + 'preview.html?c=' + payload + '&exp=' + exp + '&id=' + id + '&v=' + APP_VERSION;
    const warning = payload.length > TUNNEL_WARN_CHARS
      ? 'Long payload — some chat clients truncate URLs above ~8,000 chars.'
      : null;
    const record = { id, url, exp, createdAt: Date.now(), payloadLength: payload.length, warning };
    setTunnel(record);
    setShowTunnel(true);
    setCopied(false);
    onUpdate({ lastTunnel: { id, exp, createdAt: Date.now() } });
    toast('Tunnel server live for 15 minutes', 'success');
  };

  const copyLink = () => {
    if (!tunnel) return;
    const done = () => { setCopied(true); toast('Live link copied to the clipboard', 'success'); setTimeout(() => setCopied(false), 2600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tunnel.url).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = tunnel.url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select the link and copy manually', 'error'); }
        document.body.removeChild(ta);
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = tunnel.url;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select the link and copy manually', 'error'); }
      document.body.removeChild(ta);
    }
  };

  const revokeTunnel = () => {
    if (!tunnel) return;
    const revoked = Store.get(LS_REVOKED, []);
    const list = Array.isArray(revoked) ? revoked.slice() : [];
    if (list.indexOf(tunnel.id) === -1) list.push(tunnel.id);
    Store.set(LS_REVOKED, list);
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'BT_REVOKE', id: tunnel.id });
      }
    } catch (e) { /* worker not controlling yet — the localStorage deny-list still applies */ }
    onUpdate({ lastTunnel: null });
    setTunnel(null);
    setShowTunnel(false);
    toast('Tunnel revoked — that link now returns a 410', 'warn');
  };

  const openTab = () => {
    try {
      const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank', 'noopener');
      if (!w) { toast('The browser blocked the pop-up — allow pop-ups for this site', 'warn'); return; }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { toast('Could not open the preview tab', 'error'); }
  };

  const popOut = () => {
    const w = window.open('', '_blank');
    if (!w) { toast('The browser blocked the pop-up — allow pop-ups for this site', 'warn'); return; }
    w.document.open();
    w.document.write(doc);
    w.document.close();
  };

  const size = Object.keys(files).reduce((acc, k) => acc + (files[k] || '').length, 0);
  const swTone = swState === 'active' ? 'emerald' : swState === 'failed' ? 'rose' : swState === 'unsupported' ? 'amber' : 'slate';
  const swLabel = { active: 'Tunnel worker active', installing: 'Worker installing…', failed: 'Worker registration failed', unsupported: 'No service worker support', checking: 'Checking worker…' }[swState];

  const editorStack = isSplit
    ? [
        { key: 'html', label: 'index.html', lang: 'html', accent: 'cyan' },
        { key: 'css', label: 'style.css', lang: 'css', accent: 'violet' },
        { key: 'js', label: 'app.js', lang: 'js', accent: 'amber' }
      ]
    : [{ key: 'html', label: 'index.html', lang: 'html', accent: 'cyan' }];

  return (
    <div className="flex min-h-screen flex-col">
      {/* ---------------- sticky workspace header ---------------- */}
      <header className="sticky top-0 z-40 border-b border-slate-800/60 bg-slate-950/80 bt-glass">
        <div className="mx-auto flex w-full max-w-[1800px] flex-wrap items-center gap-2 px-3 py-2.5 sm:px-4">
          <Btn variant="ghost" size="sm" icon="ArrowLeft" onClick={onBack} title="Back to dashboard" />

          <div className="flex min-w-0 items-center gap-2">
            <div className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-cyan-500/30 bg-cyan-500/10 text-cyan-300">
              <Icon name={isSplit ? 'Layers' : 'FileCode2'} size={15} />
            </div>
            {renaming ? (
              <input
                autoFocus
                value={nameDraft}
                onChange={(e) => setNameDraft(e.target.value)}
                onBlur={renameCommit}
                onKeyDown={(e) => { if (e.key === 'Enter') renameCommit(); if (e.key === 'Escape') { setNameDraft(project.name); setRenaming(false); } }}
                className="w-44 rounded-md border border-cyan-500/50 bg-slate-950 px-2 py-1 text-[13px] font-semibold text-slate-100 outline-none sm:w-60"
              />
            ) : (
              <button type="button" onClick={() => { setNameDraft(project.name); setRenaming(true); }} title="Click to rename"
                className="group flex min-w-0 items-center gap-1.5 rounded-md px-1.5 py-1 transition hover:bg-slate-800/60 bt-focus">
                <span className="truncate text-[13.5px] font-semibold tracking-tight text-slate-100">{project.name}</span>
                <Icon name="Pencil" size={11} className="shrink-0 text-slate-600 transition group-hover:text-cyan-400" />
              </button>
            )}
            <Badge tone={isSplit ? 'violet' : 'cyan'} className="hidden md:inline-flex">{isSplit ? 'Multi-file' : 'Single HTML'}</Badge>
          </div>

          <div className="ml-auto flex flex-wrap items-center gap-1.5">
            <span className="hidden items-center gap-1.5 rounded-lg border border-slate-800/70 bg-slate-900/60 px-2.5 py-1.5 lg:inline-flex">
              <Icon name={swState === 'active' ? 'ShieldCheck' : 'ShieldAlert'} size={12} className={swState === 'active' ? 'text-emerald-400' : 'text-amber-400'} />
              <span className="text-[10.5px] font-semibold text-slate-400">{swLabel}</span>
            </span>
            <Btn variant="ghost" size="sm" icon="Settings2" onClick={() => { setNameDraft(project.name); setRenaming(true); }} title="Rename project" />
            <Btn variant="outline" size="sm" icon="Eraser" onClick={() => setConfirm('clear')} title="Clear the current editor pane">Clear</Btn>
            <Btn variant="outline" size="sm" icon="FileX2" onClick={() => setConfirm('template')} title="Remove the starter template">Remove Template</Btn>
            <Btn variant="outline" size="sm" icon="Download" onClick={() => downloadProject(project)} title="Download project">
              <span className="hidden sm:inline">{isSplit ? 'Download .zip' : 'Download .html'}</span>
            </Btn>
            <Btn variant="danger" size="sm" icon="Trash2" onClick={() => setConfirm('delete')} title="Delete project" />
          </div>
        </div>

        {/* ---------------- utility strip ---------------- */}
        <div className="mx-auto flex w-full max-w-[1800px] flex-wrap items-center gap-2 border-t border-slate-800/50 px-3 py-2 sm:px-4">
          <div className="flex items-center gap-1 rounded-lg border border-slate-800/70 bg-slate-900/50 p-0.5">
            {[
              { key: 'split', label: 'Split', icon: 'Columns2' },
              { key: 'columns', label: 'Columns', icon: 'LayoutGrid' },
              { key: 'preview', label: 'Preview', icon: 'Eye' }
            ].filter((m) => isSplit || m.key !== 'columns').map((m) => (
              <button
                key={m.key}
                type="button"
                onClick={() => setMode(m.key)}
                className={['inline-flex items-center gap-1.5 rounded-md px-2.5 py-1 text-[11.5px] font-semibold transition bt-focus',
                  mode === m.key ? 'bg-slate-800 text-cyan-300 shadow-sm' : 'text-slate-400 hover:text-slate-200'].join(' ')}
              >
                <Icon name={m.icon} size={12} />{m.label}
              </button>
            ))}
          </div>

          {isSplit && mode !== 'preview' ? (
            <div className="flex items-center gap-1 rounded-lg border border-slate-800/70 bg-slate-900/50 p-0.5">
              {editorStack.map((p) => (
                <button
                  key={p.key}
                  type="button"
                  onClick={() => setPane(p.key)}
                  className={['rounded-md px-2.5 py-1 font-mono text-[11px] font-semibold transition bt-focus',
                    pane === p.key ? 'bg-slate-800 text-slate-100' : 'text-slate-500 hover:text-slate-300'].join(' ')}
                >
                  {p.label}
                </button>
              ))}
            </div>
          ) : null}

          <div className="ml-auto flex flex-wrap items-center gap-2 text-[10.5px] text-slate-500">
            <span className="inline-flex items-center gap-1"><Icon name="HardDrive" size={11} />{bytes(size)}</span>
            <span className="inline-flex items-center gap-1"><Icon name="Link2" size={11} />payload {payload.length.toLocaleString()} ch</span>
            <span className="inline-flex items-center gap-1"><Icon name="Save" size={11} />autosaved {relTime(project.updatedAt)}</span>
          </div>
        </div>
      </header>

      {/* ---------------- canvas ---------------- */}
      <main className="mx-auto flex w-full max-w-[1800px] flex-1 flex-col gap-3 px-3 py-3 sm:px-4">
        {mode === 'preview' ? (
          <div className="flex min-h-[70vh] flex-1 flex-col">
            <PreviewPane doc={doc} key={previewKey} onRefresh={() => setPreviewKey((k) => k + 1)} onOpenTab={openTab} onPopOut={popOut} />
          </div>
        ) : mode === 'columns' && isSplit ? (
          <div className="grid min-h-[70vh] flex-1 grid-cols-1 gap-3 lg:grid-cols-3">
            {editorStack.map((p) => (
              <CodePane
                key={p.key}
                lang={p.lang}
                label={p.label}
                accent={p.accent}
                value={files[p.key] || ''}
                onChange={(v) => setFile(p.key, v)}
              />
            ))}
          </div>
        ) : (
          <div className="flex min-h-[70vh] flex-1 flex-col gap-3 xl:flex-row">
            <div className="flex min-h-[52vh] flex-1 flex-col xl:min-h-0">
              <CodePane
                lang={editorStack.find((p) => p.key === pane)?.lang || 'html'}
                label={editorStack.find((p) => p.key === pane)?.label || 'index.html'}
                accent={editorStack.find((p) => p.key === pane)?.accent || 'cyan'}
                value={files[pane] || ''}
                onChange={(v) => setFile(pane, v)}
              />
            </div>
            <div className="flex min-h-[52vh] flex-1 flex-col xl:min-h-0">
              <PreviewPane doc={doc} key={previewKey} onRefresh={() => setPreviewKey((k) => k + 1)} onOpenTab={openTab} onPopOut={popOut} />
            </div>
          </div>
        )}

        {/* ---------------- tunnel launch deck ---------------- */}
        <section className="relative overflow-hidden rounded-2xl border border-slate-800/60 bg-slate-900/70 bt-glass p-4 sm:p-5">
          <div className="pointer-events-none absolute inset-0 opacity-70" style={{ backgroundImage: 'radial-gradient(600px 200px at 12% 0%, rgba(34,211,238,.12), transparent 70%), radial-gradient(500px 200px at 88% 100%, rgba(167,139,250,.10), transparent 70%)' }} />
          <div className="relative flex flex-col gap-4 lg:flex-row lg:items-center">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2">
                <Icon name="Antenna" size={15} className="text-cyan-400" />
                <h2 className="text-[13.5px] font-semibold tracking-tight text-slate-100">Deployment tunnel</h2>
                <Badge tone="cyan">15-minute TTL</Badge>
              </div>
              <p className="mt-1.5 text-[12px] leading-relaxed text-slate-400">
                Packs the active project into an lz-string URL, hands it to <span className="font-mono text-slate-300">preview.html</span>,
                and lets the service worker serve it as a top-level document — no iframe, no build step, no backend.
              </p>
              <div className="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-[10.5px] text-slate-500">
                <span className="inline-flex items-center gap-1"><Icon name="Lock" size={10} />client-side only</span>
                <span className="inline-flex items-center gap-1"><Icon name="Timer" size={10} />expires {new Date(Date.now() + TUNNEL_TTL_MS).toLocaleTimeString()}</span>
                <span className="inline-flex items-center gap-1"><Icon name="Boxes" size={10} />{isSplit ? '3 files fused' : '1 file packed'}</span>
              </div>
            </div>

            <div className="relative shrink-0">
              <span className="pointer-events-none absolute inset-0 rounded-xl border border-cyan-400/50 animate-bt-ring" />
              <button
                type="button"
                onClick={spinUpTunnel}
                className="relative inline-flex w-full items-center justify-center gap-2 rounded-xl border border-cyan-400/50 bg-gradient-to-r from-cyan-500 to-violet-500 px-6 py-3 text-[13.5px] font-bold tracking-tight text-slate-950 shadow-2xl shadow-cyan-500/25 transition-all duration-200 hover:from-cyan-400 hover:to-violet-400 hover:shadow-cyan-400/40 active:scale-[.98] bt-focus lg:w-auto"
              >
                <Icon name="Rocket" size={17} />
                🚀 Spin Up Tunnel Server
              </button>
            </div>
          </div>
        </section>
      </main>

      {/* ---------------- status bar ---------------- */}
      <footer className="sticky bottom-0 z-30 border-t border-slate-800/60 bg-slate-950/85 bt-glass">
        <div className="mx-auto flex w-full max-w-[1800px] flex-wrap items-center gap-x-4 gap-y-1 px-3 py-1.5 text-[10.5px] text-slate-500 sm:px-4">
          <span className="inline-flex items-center gap-1"><Icon name="CircleDot" size={10} className="text-emerald-400" />{isSplit ? 'multi-file build' : 'single-file build'}</span>
          <span className="inline-flex items-center gap-1"><Icon name="Braces" size={10} />{editorStack.find((p) => p.key === pane)?.label}</span>
          <span className="inline-flex items-center gap-1"><Icon name="Sparkles" size={10} />React 18 · Tailwind · Lucide · lz-string</span>
          <span className="ml-auto inline-flex items-center gap-1">
            <Icon name={tunnel ? 'Radio' : 'RadioTower'} size={10} className={tunnel ? 'text-emerald-400' : 'text-slate-600'} />
            {tunnel ? 'tunnel live · ' + clock(Math.max(0, tunnel.exp - Date.now())) : 'tunnel idle'}
          </span>
        </div>
      </footer>

      <TunnelOverlay
        tunnel={showTunnel ? tunnel : null}
        onClose={() => setShowTunnel(false)}
        onRevoke={revokeTunnel}
        onCopy={copyLink}
        copied={copied}
        baseUrl={baseUrl()}
      />

      <ConfirmDialog
        open={confirm === 'clear'}
        title="Clear the current pane?"
        icon="Eraser"
        message={'This empties the ' + (isSplit ? pane.toUpperCase() : 'HTML') + ' editor pane immediately. Everything else in the project is untouched.'}
        confirmLabel="Clear pane"
        onCancel={() => setConfirm(null)}
        onConfirm={() => { clearPane(); setConfirm(null); }}
      />
      <ConfirmDialog
        open={confirm === 'template'}
        title="Remove the starter template?"
        icon="FileX2"
        message="All default boilerplate is wiped and every pane is reduced to a blank canvas. Your current code will be lost — download the project first if you want to keep it."
        confirmLabel="Wipe to blank canvas"
        onCancel={() => setConfirm(null)}
        onConfirm={wipeTemplate}
      />
      <ConfirmDialog
        open={confirm === 'delete'}
        title="Delete this project?"
        icon="Trash2"
        message={'“' + project.name + '” will be permanently removed from this browser, along with its tunnel history.'}
        confirmLabel="Delete project"
        onCancel={() => setConfirm(null)}
        onConfirm={() => { setConfirm(null); onDelete(project.id); }}
      />
    </div>
  );
}

/* -----------------------------------------------------------------------------
   Error boundary — catches render faults and offers a recovery path
   -------------------------------------------------------------------------- */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { this.setState({ info }); }
  render() {
    if (!this.state.error) return this.props.children;
    const msg = String((this.state.error && this.state.error.message) || this.state.error);
    return (
      <div className="flex min-h-screen items-center justify-center p-6">
        <div className="w-full max-w-lg rounded-2xl border border-rose-500/30 bg-slate-900/85 bt-glass p-6">
          <div className="mb-4 flex h-11 w-11 items-center justify-center rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300">
            <Icon name="AlertOctagon" size={20} />
          </div>
          <h1 className="text-base font-semibold text-slate-100">The workspace hit a rendering fault</h1>
          <p className="mt-2 text-[12.5px] leading-relaxed text-slate-400">
            Your projects are still safe in local storage — this is a UI-level failure, not data loss. Reload to rebuild the workspace.
          </p>
          <pre className="bt-scroll mt-4 max-h-40 overflow-auto rounded-lg border border-slate-800 bg-slate-950 p-3 font-mono text-[11px] leading-relaxed text-rose-200">{msg}</pre>
          <div className="mt-4 flex flex-wrap gap-2">
            <Btn variant="primary" size="md" icon="RefreshCw" onClick={() => window.location.reload()}>Reload the IDE</Btn>
            <Btn variant="outline" size="md" icon="Download" onClick={() => {
              try {
                const dump = window.localStorage.getItem(LS_PROJECTS) || '[]';
                triggerDownload(new Blob([dump], { type: 'application/json' }), 'browser-tunnel-backup.json');
              } catch (e) { /* ignore */ }
            }}>Export a backup</Btn>
          </div>
        </div>
      </div>
    );
  }
}

/* -----------------------------------------------------------------------------
   Root application
   -------------------------------------------------------------------------- */
function App() {
  const [projects, setProjects] = useState([]);
  const [view, setView] = useState('dashboard');
  const [activeId, setActiveId] = useState(null);
  const [newOpen, setNewOpen] = useState(false);
  const [renameTarget, setRenameTarget] = useState(null);
  const [renameDraft, setRenameDraft] = useState('');
  const [toasts, setToasts] = useState([]);
  const [storageOk, setStorageOk] = useState(true);
  const hydrated = useRef(false);
  const saveTimer = useRef(null);

  /* ---- hydration ---- */
  useEffect(() => {
    const ok = Store.available();
    setStorageOk(ok);
    if (!ok) toast('Local storage is blocked — this session will not persist', 'error', 7000);
    const raw = Store.get(LS_PROJECTS, []);
    const list = Array.isArray(raw) ? raw.filter((p) => p && p.id && p.files) : [];
    if (!Array.isArray(raw) && raw !== null) toast('Saved projects were unreadable and have been reset', 'warn');
    setProjects(list);
    hydrated.current = true;
  }, []);

  /* ---- toasts ---- */
  useEffect(() => {
    const sub = (t) => {
      setToasts((cur) => cur.concat([t]));
      setTimeout(() => setToasts((cur) => cur.filter((x) => x.key !== t.key)), t.duration || 3600);
    };
    toastBus.subs.add(sub);
    return () => toastBus.subs.delete(sub);
  }, []);

  /* ---- debounced persistence ---- */
  useEffect(() => {
    if (!hydrated.current) return undefined;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const res = Store.set(LS_PROJECTS, projects);
      if (!res.ok) {
        setStorageOk(false);
        toast(res.message, 'error', 6000);
      }
    }, 380);
    return () => clearTimeout(saveTimer.current);
  }, [projects]);

  const active = useMemo(() => projects.find((p) => p.id === activeId) || null, [projects, activeId]);

  const createProject = (name, type, imported) => {
    const p = newProject(name, type, imported);
    setProjects((cur) => [p].concat(cur));
    setNewOpen(false);
    setActiveId(p.id);
    setView('workspace');
    toast('Created “' + p.name + '”', 'success');
  };

  const updateProject = useCallback((patch) => {
    setProjects((cur) => cur.map((p) => (p.id === activeId ? Object.assign({}, p, patch, { updatedAt: new Date().toISOString() }) : p)));
  }, [activeId]);

  const deleteProject = (id) => {
    setProjects((cur) => cur.filter((p) => p.id !== id));
    if (activeId === id) { setActiveId(null); setView('dashboard'); }
    toast('Project deleted', 'info');
  };

  const openProject = (id) => {
    setActiveId(id);
    setView('workspace');
  };

  const submitRename = () => {
    const next = renameDraft.trim();
    if (!renameTarget) return;
    if (!next) { toast('A project name cannot be empty', 'warn'); return; }
    setProjects((cur) => cur.map((p) => (p.id === renameTarget.id ? Object.assign({}, p, { name: next, updatedAt: new Date().toISOString() }) : p)));
    toast('Renamed to “' + next + '”', 'success');
    setRenameTarget(null);
  };

  return (
    <div className="relative min-h-screen bt-grid-bg">
      {view === 'dashboard' || !active ? (
        <Dashboard
          projects={projects}
          storageOk={storageOk}
          onNew={() => setNewOpen(true)}
          onOpen={openProject}
          onRename={(p) => { setRenameTarget(p); setRenameDraft(p.name); }}
          onDownload={downloadProject}
          onDelete={(p) => deleteProject(p.id)}
        />
      ) : (
        <Workspace
          key={active.id}
          project={active}
          onUpdate={updateProject}
          onBack={() => { setView('dashboard'); }}
          onDelete={deleteProject}
        />
      )}

      <NewProjectModal open={newOpen} onClose={() => setNewOpen(false)} onCreate={createProject} />

      <Modal
        open={!!renameTarget}
        onClose={() => setRenameTarget(null)}
        title="Rename project"
        subtitle="The name is used for downloads and workspace headers."
        icon="PencilLine"
        tone="violet"
        width="max-w-md"
        footer={
          <>
            <Btn variant="outline" size="md" onClick={() => setRenameTarget(null)}>Cancel</Btn>
            <Btn variant="primary" size="md" icon="Check" onClick={submitRename}>Save name</Btn>
          </>
        }
      >
        <input
          autoFocus
          value={renameDraft}
          onChange={(e) => setRenameDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') submitRename(); }}
          className={inputCls}
          placeholder="Project name"
        />
      </Modal>

      <Toasts items={toasts} />
    </div>
  );
}

/* -----------------------------------------------------------------------------
   Mount + boot watchdog
   -------------------------------------------------------------------------- */
(function boot() {
  const rootEl = document.getElementById('root');
  const bootEl = document.getElementById('bt-boot');

  const assets = window.__BT_ASSETS__ || {};
  const missing = Object.keys(assets).filter((k) => !assets[k]);

  if (missing.length) {
    const msgEl = bootEl && bootEl.querySelector('[data-boot-msg]');
    if (msgEl) {
      msgEl.innerHTML = 'Some CDN assets failed to load: <code>' + missing.join(', ') +
        '</code>. Reload the page, or check that your network / content blocker allows unpkg.com, cdnjs.cloudflare.com and cdn.tailwindcss.com.';
    }
  }

  if (!window.React || !window.ReactDOM) {
    const msgEl = bootEl && bootEl.querySelector('[data-boot-msg]');
    if (msgEl) msgEl.innerHTML = 'React could not be loaded from its CDN. The IDE cannot start without it — check the network connection and reload.';
    return;
  }

  try {
    const root = ReactDOM.createRoot(rootEl);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
    requestAnimationFrame(() => {
      if (bootEl) {
        bootEl.style.transition = 'opacity .3s ease';
        bootEl.style.opacity = '0';
        setTimeout(() => bootEl.remove(), 340);
      }
    });
  } catch (err) {
    const msgEl = bootEl && bootEl.querySelector('[data-boot-msg]');
    if (msgEl) msgEl.textContent = 'Boot failed: ' + (err && err.message ? err.message : String(err));
  }

  /* Watchdog: if nothing mounted, explain why instead of hanging on the spinner. */
  setTimeout(() => {
    if (!rootEl.childElementCount) {
      const msgEl = bootEl && bootEl.querySelector('[data-boot-msg]');
      if (msgEl) {
        msgEl.innerHTML = 'The workspace did not mount. Assets detected — ' +
          Object.keys(assets).map((k) => k + ':' + (assets[k] ? 'ok' : 'missing')).join(' · ') +
          '. Open the browser console for the underlying error.';
      }
    }
  }, 9000);
})();
</script>
